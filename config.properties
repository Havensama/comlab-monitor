# ===== UE CompLab Monitoring System =====
# Which app runs when started without an argument: student or admin
app.mode=student

# ---- Database (MySQL lives on the ADMIN laptop) ----
# On the admin laptop: localhost
# On the student laptop: the admin laptop's IPv4 address (run ipconfig there), e.g. 192.168.43.10
db.host=localhost
db.port=3306
db.name=comlab
db.user=labuser
db.pass=lab123
# true only for a cloud database (Aiven etc.); false for XAMPP
db.ssl=false

# ---- This workstation (student laptop) ----
pc.id=PC-14
pc.location=Lab 6 · CoE Building
lab.hours=7:00 AM – 9:00 PM

# Secret exit for the kiosk: press Ctrl+Shift+F12 on the login screen, then type this password
kiosk.exitPassword=letmeout
# false = normal window while developing in IntelliJ. Set to true on the student laptop for the demo.
kiosk.lock=false
